version: '3.8'

services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: chess_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chess_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-chess_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chess_user} -d ${POSTGRES_DB:-chess_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chess_network

  # 2. Redis Cache & Active Game Pub/Sub State
  redis:
    image: redis:7-alpine
    container_name: chess_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-chess_redis_secret}"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-chess_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chess_network

  # 3. Backend API & Socket.IO Game Engine Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chess_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-chess_user}:${POSTGRES_PASSWORD:-chess_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-chess_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-chess_redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_chess_key_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refresh_secret_jwt_chess_key_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:80}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - chess_network

  # 4. Frontend React Production Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chess_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - chess_network

  # 5. Nginx Master Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: chess_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - chess_network

volumes:
  pgdata:
  redisdata:

networks:
  chess_network:
    driver: bridge
