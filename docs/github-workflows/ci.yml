name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: Typecheck, engine and multiplayer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Move generator (perft)
        run: npx tsx src/engine/perft.test.ts

      - name: Engine strength (tactical suite)
        run: npx tsx src/engine/bench.ts 600

      - name: Multiplayer rules
        run: npm run test:multiplayer

      - name: Build
        run: npm run build
