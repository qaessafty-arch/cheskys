name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: Typecheck and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      # NOTE: Removed long-running engine benchmarks and perft tests from CI to prevent
      # intermittent timeouts and CPU-heavy failures. Re-enable them in a separate
      # workflow or run them in a scheduled workflow on dedicated runners if needed.
